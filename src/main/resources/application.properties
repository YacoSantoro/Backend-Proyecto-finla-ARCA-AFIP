spring.application.name=facturacion-arca
server.port=8080

# ---------- Base de datos (H2 en archivo ./data/facturacion) ----------
spring.datasource.url=jdbc:h2:file:./data/facturacion;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Carga clientes / articulos / listas de precio de ejemplo (data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# Consola web de la base: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ---------- ARCA / AFIP ----------
# true  = NO se conecta a ARCA, inventa un CAE (sirve para probar sin certificado)
# false = se conecta de verdad (homologacion o produccion segun arca.produccion)
arca.simulado=true
arca.produccion=false
# Tu CUIT (sin guiones) y el punto de venta dado de alta en ARCA
arca.cuit=20111111112
arca.punto-venta=1
# Archivos generados en el paso a paso (NO se suben a GitHub)
arca.clave-privada=certificados/privada_test.key
arca.certificado=certificados/certificado_test.crt
# Carpeta donde se guarda el ticket (token + sign) para reutilizarlo ~12 horas
arca.carpeta-tickets=data

# ---------- Datos del emisor que se imprimen en el ticket PDF ----------
emisor.razon-social=Mi Comercio
emisor.domicilio=Av. Siempre Viva 742 - CABA
emisor.condicion-iva=Responsable Monotributo
emisor.ingresos-brutos=20111111112
emisor.inicio-actividades=01/01/2024
